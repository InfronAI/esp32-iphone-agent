name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Unit tests (simulator, unsigned)
        run: |
          sim=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+[A-Za-z ]*\(' | head -1 | sed 's/ ($//')
          echo "simulator: $sim"
          xcodebuild test -scheme IPhoneAgent -destination "platform=iOS Simulator,name=$sim" \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.8 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build legacy bridge
        run: hardware/flash.sh --build-only
      - name: Build standalone cloud firmware with placeholder credentials
        run: |
          cp hardware/hid_bridge/secrets.example.h hardware/hid_bridge/secrets.h
          hardware/flash.sh --cloud --build-only
      - name: Goal harness and action tests
        run: |
          make -C hardware/tests cloud
          make -C hardware/tests harness
      - name: Host tests (bplist, GOP buffer)
        run: make -C hardware/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/demo/package-lock.json
      - run: npm ci --prefix tools/demo
      - run: cd tools/demo && npx playwright install --with-deps chromium
      - run: node tools/demo/test-web.cjs

  server:  # legacy v0.1.0 architecture, kept working
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
